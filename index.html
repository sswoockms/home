  <script>
  (function () {
    var msgs = [];
    function show() {
      if (!document.body || document.getElementById('dataErr')) return;
      var d = document.createElement('div');
      d.id = 'dataErr';
      d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;padding:14px 18px;background:#b3261e;color:#fff;font:600 14px/1.6 sans-serif;white-space:pre-line';
      d.textContent = '⚠ data.js 에 문제가 있어서 화면이 기본값으로 나오고 있어요.\n' + msgs.join('\n') +
        '\n(괄호 [ ] { } 따옴표 " " 쉼표 , 가 빠지거나 남은 곳이 없는지 위 줄 번호 근처를 확인해 주세요)';
      document.body.appendChild(d);
    }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.tagName === 'SCRIPT' && /data\.js/.test(t.src || '')) {
        msgs.push('data.js 파일을 찾지 못했어요. 파일 이름과 위치(index.html 과 같은 곳)를 확인해 주세요.');
      } else if (e.filename && /data\.js/.test(e.filename)) {
        msgs.push('data.js ' + e.lineno + '번째 줄 근처: ' + e.message);
      } else return;
      if (document.readyState !== 'loading') show();
    }, true);
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.SITE && !msgs.length) msgs.push('data.js 를 읽지 못했어요.');
      if (msgs.length) show();
    });
  })();
  </script>

  <script>
  (function () {
    var S = window.SITE || {}, KEY = 'site-override-v1';
    var cfg = (S.firebase && S.firebase.config) || (S.guest && S.guest.firebase && S.guest.firebase.config) || null;
    window.SITE_FB = cfg;
    var SKIP = { firebase: 1, admin: 1, firebaseSdk: 1 };
    if (window.parent !== window && /[?&]preview=1/.test(location.search)) {
      try {
        var pd = window.parent.OHAdmin && window.parent.OHAdmin._state.draft;
        if (pd) Object.keys(pd).forEach(function (k) { if (!SKIP[k]) S[k] = JSON.parse(JSON.stringify(pd[k])); });
        S.music = Object.assign({}, S.music, { autoplay: false });
      } catch (e) {}
      return;
    }
    if (S.remote === false) return;
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (cached && cached.data) Object.keys(cached.data).forEach(function (k) { if (!SKIP[k]) S[k] = cached.data[k]; });
    if (!cfg || !cfg.apiKey || S.remote === false) return;
    var BASE = 'https://www.gstatic.com/firebasejs/' + (S.firebaseSdk || '13.0.0') + '/';
    function reloadOnce(rev) {
      try { if (sessionStorage.getItem('site-reloaded') === String(rev)) return; sessionStorage.setItem('site-reloaded', String(rev)); } catch (e) {}
      location.reload();
    }
    window.addEventListener('load', function () {
      setTimeout(function () {
        Promise.all([import(BASE + 'firebase-app.js'), import(BASE + 'firebase-firestore.js')]).then(function (m) {
          var app = m[0].getApps().length ? m[0].getApps()[0] : m[0].initializeApp(cfg);
          return m[1].getDoc(m[1].doc(m[1].getFirestore(app), 'site', 'config'));
        }).then(function (snap) {
          var have = cached ? cached.rev : 0;
          if (!snap.exists()) { if (cached) { try { localStorage.removeItem(KEY); } catch (e) {} reloadOnce('reset'); } return; }
          var v = snap.data();
          if (v.rev === have) return;
          var data = JSON.parse(v.json);
          try { localStorage.setItem(KEY, JSON.stringify({ rev: v.rev, data: data })); } catch (e) {}
          reloadOnce(v.rev);
        }).catch(function () {});
      }, 300);
    });
  })();
  </script>

  <script>
  window.PAGES = {};
  window.APP = { page: null };

  function toRoute(link) {
    if (!link) return '#';
    var m = String(link).match(/^(?:\.\/)?(index|oc|pair|owner|guest)\.html(?:#(.*))?$/);
    if (!m) return link;
    if (m[1] === 'index') return '#';
    return '#' + m[1] + (m[2] ? '/' + m[2] : '');
  }

  window.THEME = (function () {
    var KEYS = {
      point: '--point', title: '--t-title', text: '--t-text', sub: '--t-sub',
      line: '--t-line', soft: '--t-soft', accent: '--t-accent',
      accentText: '--t-on-accent', card: '--t-card', background: '--page-bg'
    };
    var PG = ((window.SITE || {}).colors || {}).pages || {};
    function base(name) { return [PG.all || PG, PG[name] || {}]; }
    function apply(el) {
      var m = {};
      for (var i = 1; i < arguments.length; i++) {
        var o = arguments[i];
        if (!o) continue;
        if (Array.isArray(o)) { o.forEach(function (x) { for (var k in x) if (x[k] && KEYS[k]) m[k] = x[k]; }); continue; }
        for (var k in o) if (o[k] && KEYS[k]) m[k] = o[k];
      }
      for (var key in KEYS) {
        if (m[key]) el.style.setProperty(KEYS[key], m[key]);
        else el.style.removeProperty(KEYS[key]);
      }
    }
    function of(d) {
      if (!d) return null;
      var t = {}, k;
      if (d.theme) for (k in d.theme) t[k] = d.theme[k];
      if (d.color) t.point = d.color;
      return t;
    }
    return { apply: apply, base: base, of: of };
  })();

  window.LB = (function () {
    function $(id) { return document.getElementById(id); }
    var items = [], idx = 0;
    function show(i) {
      idx = (i + items.length) % items.length;
      var it = items[idx], img = $('lbImg');
      img.classList.remove('is-in'); void img.offsetWidth;
      img.src = it.image; img.alt = it.caption || '';
      img.classList.add('is-in');
      $('lbCap').textContent = it.caption || '';
      $('lbCount').textContent = (idx + 1) + ' / ' + items.length;
      $('lbPrev').hidden = $('lbNext').hidden = items.length < 2;
    }
    function open(list, i) { items = list; $('lb').hidden = false; show(i); }
    function close() { $('lb').hidden = true; $('lbImg').src = ''; }
    $('lbClose').onclick = close;
    $('lbPrev').onclick = function () { show(idx - 1); };
    $('lbNext').onclick = function () { show(idx + 1); };
    $('lb').addEventListener('click', function (e) { if (e.target === this) close(); });
    document.addEventListener('keydown', function (e) {
      if ($('lb').hidden) return;
      if (e.key === 'Escape') { close(); e.stopImmediatePropagation(); }
      if (e.key === 'ArrowLeft') show(idx - 1);
      if (e.key === 'ArrowRight') show(idx + 1);
    });
    return { open: open, close: close, isOpen: function () { return !$('lb').hidden; } };
  })();

  window.LOCK = (function () {
    var ROUNDS = 150000;
    function b64(buf) {
      var s = '', b = new Uint8Array(buf);
      for (var i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
      return btoa(s);
    }
    function unb64(s) {
      var bin = atob(s), b = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
      return b;
    }
    function key(pw, salt, rounds, use) {
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (k) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: rounds, hash: 'SHA-256' }, k,
          { name: 'AES-GCM', length: 256 }, false, [use]);
      });
    }
    function pipe(bytes, stream) { return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer(); }
    function encrypt(text, pw) {
      var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
      var raw = new TextEncoder().encode(text);
      var packed = window.CompressionStream
        ? pipe(raw, new CompressionStream('gzip')).then(function (b) { return { z: 1, b: b }; })
        : Promise.resolve({ z: 0, b: raw });
      return packed.then(function (p) {
        return key(pw, salt, ROUNDS, 'encrypt').then(function (k) {
          return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, p.b);
        }).then(function (ct) {
          return { v: 1, z: p.z, rounds: ROUNDS, salt: b64(salt), iv: b64(iv), data: b64(ct) };
        });
      });
    }
    function decrypt(enc, pw) {
      return key(pw, unb64(enc.salt), enc.rounds || ROUNDS, 'decrypt').then(function (k) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(enc.iv) }, k, unb64(enc.data));
      }).then(function (buf) {
        return enc.z ? pipe(buf, new DecompressionStream('gzip')) : buf;
      }).then(function (buf) { return new TextDecoder().decode(buf); });
    }
    return { encrypt: encrypt, decrypt: decrypt };
  })();

  window.GCAL = (function () {
    var G = ((window.SITE || {}).calendar || {}).google || {};
    var ids = (G.calendarIds || []).filter(Boolean), key = G.apiKey || '';
    var cache = {}, days = {}, seen = {};
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function load(y, m) {
      if (!key || !ids.length) return Promise.resolve(false);
      var mk = y + '-' + m;
      if (cache[mk]) return cache[mk];
      var min = new Date(y, m, 1).toISOString(), max = new Date(y, m + 1, 1).toISOString();
      cache[mk] = Promise.all(ids.map(function (id) {
        return fetch('https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(id) + '/events?key=' +
          encodeURIComponent(key) + '&timeMin=' + encodeURIComponent(min) + '&timeMax=' + encodeURIComponent(max) +
          '&singleEvents=true&orderBy=startTime&maxResults=250')
          .then(function (r) { return r.ok ? r.json() : { items: [] }; })
          .catch(function () { return { items: [] }; });
      })).then(function (res) {
        res.forEach(function (r) {
          (r.items || []).forEach(function (e) {
            if (!e.start || !e.end) return;
            var allDay = !!e.start.date;
            var s = new Date(allDay ? e.start.date + 'T00:00:00' : e.start.dateTime);
            var en = new Date(allDay ? e.end.date + 'T00:00:00' : (e.end.dateTime || e.start.dateTime));
            if (allDay) en = new Date(en.getTime() - 86400000);
            var cur = new Date(s.getFullYear(), s.getMonth(), s.getDate());
            var last = new Date(en.getFullYear(), en.getMonth(), en.getDate()), n = 0;
            while (cur <= last && n++ < 62) {
              var k = cur.getFullYear() + '-' + pad(cur.getMonth() + 1) + '-' + pad(cur.getDate());
              if (!seen[e.id + k]) {
                seen[e.id + k] = 1;
                (days[k] = days[k] || []).push({ title: e.summary || '(제목 없음)',
                  time: allDay ? '' : pad(s.getHours()) + ':' + pad(s.getMinutes()) });
              }
              cur.setDate(cur.getDate() + 1);
            }
          });
        });
        return true;
      });
      return cache[mk];
    }
    function on(y, m, d) { return days[y + '-' + pad(m) + '-' + pad(d)] || []; }
    return { load: load, on: on, enabled: !!(key && ids.length) };
  })();

  window.TAGFILTER = function (host, grid, tagLists) {
    var names = [];
    tagLists.forEach(function (t) { (t || []).forEach(function (x) { if (x && names.indexOf(x) < 0) names.push(x); }); });
    if (!names.length) return;
    var bar = document.createElement('div'); bar.className = 'tagbar';
    function pick(t) {
      [].forEach.call(bar.children, function (b) { b.classList.toggle('is-active', b.dataset.tag === t); });
      [].forEach.call(grid.children, function (c, i) { c.hidden = !!t && (tagLists[i] || []).indexOf(t) < 0; });
    }
    [''].concat(names).forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'pr-nav-btn'; b.type = 'button'; b.textContent = t || '전체'; b.dataset.tag = t;
      b.onclick = function () { pick(t); };
      bar.appendChild(b);
    });
    host.appendChild(bar);
    pick('');
  };
  </script>

  <script>
  (function () {
    var D = window.SITE || {};

    PAGES.home = function () { document.title = D.title || 'Home'; };

    var C = D.colors || {}, P = C.player || {};
    var colorMap = {

  <script>
  (function () {

    var tracks = (M.list || []).filter(function (t) {
      return t && t.file && !/youtu\.?be/i.test(t.file);
    }).map(function (t) {
      return {
        title:  t.title  || 'Untitled',

    });

    function load(store, key) { try { return JSON.parse(window[store].getItem(key) || 'null'); } catch (e) { return null; } }

        '</head><body class="mp-popup-body"><div id="mp-root"></div>' +
        '<script>(' + MusicPlayer.toString() + ')(document.getElementById("mp-root"),' + cfg + ');<\/script>' +

      root.innerHTML =
        '<div class="mp-head">' +
          '<span class="mp-label">MUSIC</span>' +
          '<div class="mp-hbtns">' +
            (cfg.popup ? '' : '<button class="mp-icon" data-act="pop" title="새 창으로 분리">' + I.pop + '</button>') +

        '</div>' +
        '<div class="mp-main">' +
          '<div class="mp-disc"></div>' +
          '<div class="mp-info"><div class="mp-title"></div><div class="mp-artist"></div></div>' +
        '</div>' +
        '<div class="mp-bar"><span class="mp-cur">0:00</span>' +

          '<span class="mp-dur">0:00</span></div>' +
        '<div class="mp-ctrl">' +
          '<div class="mp-btns">' +

            '<button class="mp-icon" data-act="next" title="다음 곡">' + I.next + '</button>' +
          '</div>' +
          '<label class="mp-vol">' + I.vol +
            '<input class="mp-range mp-volume" type="range" min="0" max="1" step="0.01"></label>' +
        '</div>';

      function $(s) { return root.querySelector(s); }
      var elTitle = $('.mp-title'), elArtist = $('.mp-artist'), elDisc = $('.mp-disc'),
          elSeek = $('.mp-seek'), elCur = $('.mp-cur'), elDur = $('.mp-dur'),
          elPlay = $('.mp-play'), elVol = $('.mp-volume');

      function fmt(s) { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
      function fill(r) { r.style.setProperty('--p', ((r.value - r.min) / ((r.max - r.min) || 1) * 100) + '%'); }

      if (!cfg.popup) {
        var head = $('.mp-head'), dx = 0, dy = 0, drag = false;
        head.addEventListener('pointerdown', function (e) {
          if (e.target.closest('button')) return;
          if (doc.documentElement.classList.contains('is-mobile')) return;
          var r = root.getBoundingClientRect();
          dx = e.clientX - r.left; dy = e.clientY - r.top; drag = true;
          root.style.left = r.left + 'px'; root.style.top = r.top + 'px'; root.style.bottom = 'auto';
          head.setPointerCapture(e.pointerId);
        });
        head.addEventListener('pointermove', function (e) {
          if (!drag) return;
          var x = Math.min(Math.max(0, e.clientX - dx), win.innerWidth - root.offsetWidth);
          var y = Math.min(Math.max(0, e.clientY - dy), win.innerHeight - root.offsetHeight);
          root.style.left = x + 'px'; root.style.top = y + 'px';
        });
        head.addEventListener('pointerup', function () { drag = false; });
      }

      elVol.value = audio.volume; fill(elVol);

      if (!list.length) {
        root.classList.add('is-empty');
        elTitle.textContent = '음원 파일을 넣어 주세요';
        elArtist.textContent = 'data.js ⑦ music';
        root.querySelectorAll('.mp-ctrl button, .mp-seek').forEach(function (b) { b.disabled = true; });
        root.querySelector('[data-act="pop"]') && (root.querySelector('[data-act="pop"]').disabled = true);
      }

      function play() { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }

      function load(i, autoplay) {
        if (!list.length) return;
        idx = (i + list.length) % list.length;
        var t = list[idx];
        audio.src = t.file;
        elTitle.textContent = t.title;
        elArtist.textContent = t.artist;
        elDisc.style.backgroundImage = t.cover ? 'url("' + t.cover + '")' : '';
        elDisc.classList.toggle('has-cover', !!t.cover);
        if (cfg.popup) doc.title = '♪ ' + t.title;
        if (autoplay) play();
      }

      root.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b || b.disabled) return;
        var act = b.getAttribute('data-act');
        if (act === 'play') { audio.paused ? play() : audio.pause(); }
        if (act === 'prev') { audio.currentTime > 3 ? (audio.currentTime = 0) : load(idx - 1, !audio.paused); }
        if (act === 'next') { load(idx + 1, !audio.paused); }
        if (act === 'fold') { root.classList.toggle('is-folded'); }
        if (act === 'pop' && cfg.onPopout) {
          cfg.onPopout({ index: idx, time: audio.currentTime, volume: audio.volume, playing: !audio.paused });
        }
      });

      var seeking = false;
      elSeek.addEventListener('input', function () { seeking = true; fill(elSeek); elCur.textContent = fmt(elSeek.value); });
      elSeek.addEventListener('change', function () { audio.currentTime = +elSeek.value; seeking = false; });
      elVol.addEventListener('input', function () { audio.volume = +elVol.value; fill(elVol); });

      audio.addEventListener('play',  function () { root.classList.add('is-playing');    elPlay.innerHTML = I.pause; });
      audio.addEventListener('pause', function () { root.classList.remove('is-playing'); elPlay.innerHTML = I.play; });
      audio.addEventListener('loadedmetadata', function () {
        elSeek.max = audio.duration || 0; elDur.textContent = fmt(audio.duration);
        if (cfg.time) { audio.currentTime = cfg.time; cfg.time = 0; }
      });
      audio.addEventListener('timeupdate', function () {
        if (seeking) return;
        elSeek.value = audio.currentTime; fill(elSeek); elCur.textContent = fmt(audio.currentTime);
      });
      audio.addEventListener('ended', function () {
        if (list.length > 1) load(idx + 1, true); else { audio.currentTime = 0; play(); }
      });

      load(idx, false);

      if (cfg.popup) {
        var beat = function () { try { win.localStorage.setItem('mp-popup', String(Date.now())); } catch (e) {} };
        beat(); win.setInterval(beat, 1000);
        win.addEventListener('pagehide', function () { try { win.localStorage.removeItem('mp-popup'); } catch (e) {} });
      }

      if (cfg.autoplay && list.length) {
        var p = audio.play();
        if (p && p.catch) p.catch(function () {
          doc.addEventListener('pointerdown', function first(e) {
            if (root.contains(e.target)) return;
            doc.removeEventListener('pointerdown', first);
            if (audio.paused) play();
          });
        });
      }

      return {
        pause: function () { audio.pause(); },
        state: function () {
          return { index: idx, time: audio.currentTime || 0, playing: !audio.paused, volume: audio.volume };
        }
      };
    }
  })();
  </script>
</body>
</html>
